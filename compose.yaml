name: repowren

services:
  vllm:
    image: ${VLLM_IMAGE:-vllm/vllm-openai:latest-cu129}
    container_name: repowren-vllm
    ipc: host
    ports:
      - "${VLLM_PORT:-8001}:8000"
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
      HF_HUB_DISABLE_TELEMETRY: ${HF_HUB_DISABLE_TELEMETRY:-1}
    volumes:
      - huggingface-cache:/root/.cache/huggingface
      - vllm-cache:/root/.cache/vllm
    command:
      - --model
      - ${VLLM_MODEL_ID:-Qwen/Qwen2.5-Coder-0.5B-Instruct}
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --max-model-len
      - "${VLLM_MAX_MODEL_LEN:-2048}"
      - --gpu-memory-utilization
      - "${VLLM_GPU_MEMORY_UTILIZATION:-0.75}"
      - --dtype
      - ${VLLM_DTYPE:-half}
      - --enforce-eager
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped

volumes:
  huggingface-cache:
  vllm-cache:
