name: repowren

services:
  postgres:
    image: postgres:17-alpine
    container_name: repowren-postgres
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-repowren}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-repowren}
      POSTGRES_DB: ${POSTGRES_DB:-repowren}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  vllm:
    build:
      context: .
      dockerfile: Dockerfile.vllm
      args:
        VLLM_BASE_IMAGE: ${VLLM_IMAGE:-vllm/vllm-openai:v0.31.0-cu129}
    image: repowren-vllm:local
    container_name: repowren-vllm
    ipc: host
    ports:
      - "${VLLM_PORT:-8001}:8000"
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
      HF_HUB_DISABLE_TELEMETRY: ${HF_HUB_DISABLE_TELEMETRY:-1}
    volumes:
      - huggingface-cache:/root/.cache/huggingface
      - vllm-cache:/root/.cache/vllm
    command:
      - --model
      - ${VLLM_MODEL_ID:-Qwen/Qwen2.5-Coder-0.5B-Instruct}
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --max-model-len
      - "${VLLM_MAX_MODEL_LEN:-2048}"
      - --gpu-memory-utilization
      - "${VLLM_GPU_MEMORY_UTILIZATION:-0.75}"
      - --dtype
      - ${VLLM_DTYPE:-half}
      - --enforce-eager
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped

volumes:
  postgres-data:
  huggingface-cache:
  vllm-cache:
