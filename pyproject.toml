[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "local-coding-agent"
version = "0.1.0"
description = "A small, local-first AI coding agent built one milestone at a time."
readme = "architecture.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "huggingface-hub>=0.28,<2",
    "httpx>=0.27,<1",
    "python-dotenv>=1,<2",
    "uvicorn>=0.32,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
]

[project.scripts]
local-agent = "local_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
