[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "repowren"
version = "0.2.0"
description = "A small, local-first AI coding agent built one milestone at a time."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "pathspec>=0.12,<1",
    "psycopg[binary]>=3.2,<4",
    "python-dotenv>=1,<2",
    "uvicorn>=0.32,<1",
]

[project.scripts]
repowren-api = "repowren.api.app:main"
repowren-chat = "repowren.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
]

[tool.setuptools.packages.find]
include = ["repowren*"]

[tool.setuptools.package-data]
repowren = ["persistence/migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
